<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gokulites for Kidney Care</title>
  <link rel="stylesheet" href="style.css"> <!-- optional shared CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background:#f9f9f9;
      margin:0;
      padding:20px;
    }
    h2 {
      color:#2a7ae4;
    }
    .login-box {
      background:#fff;
      max-width:400px;
      margin:auto;
      padding:20px;
      border-radius:8px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width:100%;
      padding:10px;
      margin:8px 0;
    }
    button {
      background:#28a745;
      border:none;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }
    button:hover {
      background:#218838;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <form method="POST" action="backend/login.php">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p style="font-size:12px; color:#555;">Only authorized users can access this page.</p>
  </div>
</body>
</html>
