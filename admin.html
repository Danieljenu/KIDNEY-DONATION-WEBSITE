<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gokulites Fundraiser</title>
</head>
<body>
  <h2>Admin Panel</h2>
  <form id="addDonationForm">
    <label>Admission No: <input type="text" id="admission" required></label><br>
    <label>Amount: <input type="number" id="amount" required></label><br>
    <button type="submit">Add Donation</button>
  </form>
  <p id="status"></p>

  <script>
    document.getElementById("addDonationForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const admission = document.getElementById("admission").value;
      const amount = document.getElementById("amount").value;

      let response = await fetch(`/api/add`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ admission, amount })
      });

      let data = await response.json();
      document.getElementById("status").innerText = data.message;
    });
  </script>
</body>
</html>
